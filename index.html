<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>GCDC HSE Performance Executive Dashboard • Abdul Latif</title>
    <link rel="icon" type="image/png" href="https://img.icons8.com/fluency/96/shield.png">
    
    <!-- stlite CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/mountable@0.73.0/build/stlite.css">
    
    <style>
        html, body, #root {
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #f8fafc;
            font-family: 'Inter', sans-serif;
        }

        /* Sleek Loading Overlay */
        #loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 999999;
            color: #ffffff;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }

        .loader-spinner {
            width: 58px;
            height: 58px;
            border: 4px solid rgba(56, 189, 248, 0.2);
            border-top: 4px solid #38bdf8;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 22px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loader-title {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .loader-subtitle {
            font-size: 13px;
            color: #94a3b8;
            max-width: 450px;
            text-align: center;
            line-height: 1.5;
        }

        .loader-badge {
            margin-top: 20px;
            background: rgba(56, 189, 248, 0.1);
            border: 1px solid rgba(56, 189, 248, 0.25);
            padding: 6px 16px;
            border-radius: 9999px;
            font-size: 11.5px;
            font-weight: 600;
            color: #38bdf8;
        }
    </style>
</head>
<body>

    <!-- Professional Loading Screen -->
    <div id="loading-overlay">
        <div class="loader-spinner"></div>
        <div class="loader-title">
            <span>🛡️</span> GCDC HSE Performance Executive Dashboard
        </div>
        <div class="loader-subtitle">
            Running 100% full interactive Streamlit analytics engine in browser via WebAssembly (Pyodide). Identical to Localhost:8550.
        </div>
        <div class="loader-badge">
            ⚡ Powered by Kharafi National / SBARC • Develop by Abdul Latif
        </div>
    </div>

    <!-- Streamlit Root Container -->
    <div id="root"></div>

    <!-- stlite JS Engine -->
    <script src="https://cdn.jsdelivr.net/npm/@stlite/mountable@0.73.0/build/stlite.js"></script>
    <script>
        stlite.mount(
            {
                requirements: ["plotly", "pandas", "numpy"],
                entrypoint: "app.py",
                files: {
                    "app.py": {
                        url: "./app.py"
                    },
                    "single_sheet_data.csv": {
                        url: "./single_sheet_data.csv"
                    }
                }
            },
            document.getElementById("root")
        );

        // Hide loading overlay once Streamlit elements appear
        var checkInterval = setInterval(function() {
            var stApp = document.querySelector('[data-testid="stAppViewContainer"]') || document.querySelector('.stApp');
            if (stApp) {
                var overlay = document.getElementById('loading-overlay');
                if (overlay) {
                    overlay.style.opacity = '0';
                    setTimeout(function() {
                        overlay.style.display = 'none';
                    }, 500);
                }
                clearInterval(checkInterval);
            }
        }, 300);
    </script>
</body>
</html>
